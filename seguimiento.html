<title>Seguimiento Fénix</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--mo:#B8551F;--do:#D4AC00;--lv:#E8D9C8;--ll:#FBF3E9;--fo:#FDF9F5;--tx:#2a1f16;--su:#8a7a68}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--fo);color:var(--tx);min-height:100vh;overflow-x:hidden}
.screen{display:none;min-height:100vh;flex-direction:column}.screen.active{display:flex}
.hdr{background:var(--mo);padding:1rem 1.2rem;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.hdr h1{font-family:'Playfair Display',serif;color:white;font-size:17px;font-weight:600}
.sub{font-size:10px;color:rgba(255,255,255,.75);margin-top:1px}
.bk{background:none;border:none;cursor:pointer;color:white;font-size:20px;padding:4px 8px 4px 0}
.cnt{flex:1;padding:1.2rem;overflow-y:auto}
.hero{text-align:center;padding:2rem 1rem 1rem}
.hero img{width:90px;height:90px;object-fit:contain;margin-bottom:1rem}
.hero h2{font-family:'Playfair Display',serif;font-size:22px;color:var(--mo);margin-bottom:.4rem}
.hero p{font-size:13px;color:var(--su);line-height:1.6;margin-bottom:1.5rem}
.field{width:100%;padding:12px 14px;border:1.5px solid var(--lv);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--tx);background:white;outline:none;margin-bottom:.8rem}
.field:focus{border-color:var(--mo)}
.btn{width:100%;padding:13px;border-radius:11px;border:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.bp{background:var(--mo);color:white}
.bp:active{opacity:.85}
.bs{background:var(--ll);color:var(--mo)}
.tabbar{display:flex;background:white;border-bottom:2px solid var(--lv);overflow-x:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tabbtn{flex:1;padding:.8rem .5rem;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--su);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabbtn.active{color:var(--mo);border-bottom-color:var(--mo);font-weight:600}
.df-card{background:white;border-radius:12px;padding:1rem 1.1rem;margin-bottom:.9rem;border:1px solid var(--lv)}
.df-card h3{font-size:13px;font-weight:600;color:var(--mo);margin-bottom:.6rem;display:flex;align-items:center;gap:6px;justify-content:space-between}
.df-macro-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:.8rem}
.df-macro-box{background:var(--fo);border-radius:9px;padding:.65rem;text-align:center;border:1px solid var(--lv)}
.df-macro-val{font-size:1.3rem;font-weight:700;line-height:1}
.df-macro-lbl{font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;color:var(--su);margin-top:2px}
.df-macro-meta{font-size:.58rem;color:#bbb;margin-top:1px}
.df-bar-row{margin-bottom:6px}
.df-bar-top{display:flex;justify-content:space-between;font-size:.65rem;margin-bottom:2px}
.df-bar-bg{height:4px;background:var(--lv);border-radius:2px;overflow:hidden}
.df-bar-fill{height:100%;border-radius:2px;transition:width .4s}
.df-meal-item{background:var(--fo);border-radius:9px;padding:.6rem .8rem;margin-bottom:.5rem;display:flex;align-items:flex-start;gap:.5rem}
.df-meal-del{background:none;border:none;color:#ccc;cursor:pointer;font-size:.9rem;flex-shrink:0;margin-top:1px}
.df-meal-del:hover{color:#c00}
.df-hab-item{display:flex;align-items:center;gap:9px;padding:.5rem .7rem;background:var(--fo);border-radius:9px;margin-bottom:.4rem;cursor:pointer;border:1.5px solid var(--lv);transition:all .15s}
.df-hab-item.done{background:var(--ll);border-color:var(--mo)}
.df-hab-cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--lv);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s}
.df-hab-item.done .df-hab-cb{background:var(--mo);border-color:var(--mo);color:white}
.df-loading{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--su);padding:.4rem 0}
.df-loading-dots span{width:4px;height:4px;border-radius:50%;background:var(--mo);display:inline-block;animation:pu 1.2s infinite;margin:0 1px}
.df-loading-dots span:nth-child(2){animation-delay:.2s}.df-loading-dots span:nth-child(3){animation-delay:.4s}
@keyframes pu{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.df-ai-badge{font-size:.58rem;background:var(--ll);color:var(--mo);padding:2px 6px;border-radius:6px;font-weight:500;display:inline-block;margin-bottom:.4rem}
.pg-medida-row{display:flex;align-items:center;gap:10px;padding:.55rem 0;border-bottom:1px solid var(--fo)}
.pg-medida-row:last-child{border-bottom:none}
.pg-medida-label{flex:1;font-size:12px;color:var(--tx)}
.pg-medida-input{width:70px;padding:6px 8px;border:1.5px solid var(--lv);border-radius:7px;font-family:'DM Sans',sans-serif;font-size:13px;text-align:center;outline:none}
.pg-medida-input:focus{border-color:var(--mo)}
.pg-foto-upload{width:100%;aspect-ratio:3/4;border-radius:12px;background:var(--ll);border:2px dashed var(--lv);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative}
.pg-foto-upload img{width:100%;height:100%;object-fit:cover}
.pg-hist-item{background:white;border-radius:12px;border:1px solid var(--lv);padding:.9rem 1rem;margin-bottom:.6rem;display:flex;gap:.8rem;align-items:center}
.pg-hist-foto{width:50px;height:50px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--ll)}
.pg-hist-fecha{font-size:.65rem;font-weight:600;color:var(--mo)}
.pg-hist-peso{font-size:1.1rem;font-weight:700;color:var(--tx);margin-top:1px}
.pg-hist-medidas{font-size:.62rem;color:var(--su);margin-top:2px}
.pg-hist-del{background:none;border:none;color:#ccc;font-size:1rem;cursor:pointer}
.pg-compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pg-compare-col{text-align:center}
.pg-compare-col img{width:100%;border-radius:12px;aspect-ratio:3/4;object-fit:cover;background:var(--ll)}
.pg-compare-label{font-size:11px;color:var(--su);margin-top:6px;font-weight:600}
.pg-select{width:100%;padding:8px 10px;border:1.5px solid var(--lv);border-radius:9px;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--tx);background:white;margin-bottom:.5rem}
.subtabbar{display:flex;overflow-x:auto;background:white;border-bottom:2px solid var(--lv);scrollbar-width:none}
.subtabbar::-webkit-scrollbar{display:none}
.subtab{flex-shrink:0;padding:.6rem .9rem;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--su);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.subtab.active{color:var(--mo);border-bottom-color:var(--mo);font-weight:500}
</style>
</head>

// ── AUTH (correo + contraseña, misma cuenta que Mujer Fénix) ──
var sfAuthMode = 'in';
function setTabSF(mode) {
  sfAuthMode = mode;
  document.getElementById('sf-tab-in').style.background = mode==='in' ? 'var(--mo)' : 'white';
  document.getElementById('sf-tab-in').style.color = mode==='in' ? 'white' : 'var(--su)';
  document.getElementById('sf-tab-up').style.background = mode==='up' ? 'var(--mo)' : 'white';
  document.getElementById('sf-tab-up').style.color = mode==='up' ? 'white' : 'var(--su)';
  document.getElementById('sf-auth-btn').textContent = mode==='up' ? 'Crear mi cuenta' : 'Entrar';
  document.getElementById('sf-err').style.display = 'none';
}
async function doAuthSF() {
  if (!sb) { sfShowErr('Sin conexión. Recarga la página.'); return; }
  var email = document.getElementById('auth-email').value.trim();
  var pass = document.getElementById('auth-pass').value;
  if (!email || !pass) { sfShowErr('Completa tu correo y contraseña.'); return; }
  var btn = document.getElementById('sf-auth-btn');
  btn.textContent = '...'; btn.disabled = true;
  try {
    var result;
    if (sfAuthMode === 'up') {
      result = await sb.auth.signUp({ email: email, password: pass });
    } else {
      result = await sb.auth.signInWithPassword({ email: email, password: pass });
    }
    if (result.error) throw result.error;
    var label = document.getElementById('sf-userlabel');
    if (label) label.textContent = email;
    show('s-app');
    await cargarTodoSB();
    sfTab('nutricion');
  } catch(e) {
    var msgs = { 'Invalid login credentials': 'Correo o contraseña incorrectos.', 'User already registered': 'Ya tienes cuenta. Usa Entrar.', 'Password should be at least 6 characters': 'La contraseña debe tener al menos 6 caracteres.' };
    sfShowErr(msgs[e.message] || e.message);
    btn.textContent = sfAuthMode === 'up' ? 'Crear mi cuenta' : 'Entrar';
    btn.disabled = false;
  }
}
function sfShowErr(msg) {
  var el = document.getElementById('sf-err');
  el.textContent = msg; el.style.display = 'block';
}

async function cerrarSesion() {
  if (!confirm('¿Cerrar sesión?')) return;
  try { await sb.auth.signOut(); } catch(e) {}
  location.reload();
}

async function verificarSesion() {
  if (!sb) return false;
  try {
    var ud = await sb.auth.getUser();
    if (ud.data && ud.data.user) {
      var label = document.getElementById('sf-userlabel');
      if (label) label.textContent = ud.data.user.email;
      show('s-app');
      await cargarTodoSB();
      sfTab('nutricion');
      return true;
    }
  } catch(e) {}
  return false;
}

// ── SINCRONIZACIÓN GENERAL CON SUPABASE ──
// Guarda un objeto de campos en la fila del usuario (lectura-fusión-escritura, nunca sobrescribe todo)
async function sfGuardarCampos(campos) {
  if (!sb) return;
  try {
    var ud = await sb.auth.getUser();
    if (!ud.data || !ud.data.user) return;
    var email = ud.data.user.email;
    var res = await sb.from('fichas').select('data').eq('email', email).single();
    var existing = (res.data && res.data.data) ? res.data.data : {};
    Object.assign(existing, campos);
    await sb.from('fichas').upsert({ email: email, data: existing, updated_at: new Date().toISOString() }, { onConflict: 'email' });
  } catch(e) { console.warn('Error guardando en Supabase:', e); }
}

async function cargarTodoSB() {
  if (!sb) return;
  try {
    var ud = await sb.auth.getUser();
    if (!ud.data || !ud.data.user) return;
    var res = await sb.from('fichas').select('data').eq('email', ud.data.user.email).single();
    if (res.data && res.data.data) {
      var d = res.data.data;
      if (d.dias) localStorage.setItem('sf_dias_v1', JSON.stringify(d.dias));
      if (d.progreso) localStorage.setItem('sf_progreso_v1', JSON.stringify(d.progreso));
      if (d.comidasGuardadas) localStorage.setItem('sf_comidas_guardadas_v1', JSON.stringify(d.comidasGuardadas));
      if (d.perfil) localStorage.setItem('sf_perfil_v1', JSON.stringify(d.perfil));
      if (d.habitosPersonales) localStorage.setItem('sf_habitos_personales_v1', JSON.stringify(d.habitosPersonales));
    }
  } catch(e) { console.warn('Error cargando desde Supabase:', e); }
}

function dfToast(msg) {
  var t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--mo);color:white;padding:8px 18px;border-radius:20px;font-size:13px;z-index:9999;opacity:1;transition:opacity .4s';
  document.body.appendChild(t);
  setTimeout(function(){ t.style.opacity='0'; setTimeout(function(){ t.remove(); }, 400); }, 1800);
}

// ═══════════════════════════════════════════
// PERFIL POR PERSONA (sin valores por defecto de nadie)
// ═══════════════════════════════════════════
var FACTORES_ACTIVIDAD = { sedentaria: 1.2, ligera: 1.375, moderada: 1.55 };

function pfGetPerfil() {
  try { return JSON.parse(localStorage.getItem('sf_perfil_v1') || 'null'); } catch(e) { return null; }
}
function pfSavePerfil(perfil) {
  try { localStorage.setItem('sf_perfil_v1', JSON.stringify(perfil)); } catch(e) {}
  sfGuardarCampos({ perfil: perfil });
}
function pfCalcularCalorias() {
  var p = pfGetPerfil();
  if (!p) return null;
  var bmr = 10*p.peso + 6.25*p.altura - 5*p.edad - 161;
  var factor = FACTORES_ACTIVIDAD[p.actividad] || 1.2;
  var base = Math.round(bmr * factor);
  var objetivo = Math.round(base - (p.deficit || 0));
  return { base: base, objetivo: objetivo, deficit: p.deficit || 0 };
}
function pfCalcularMetas() {
  // Macros objetivo calculados a partir del perfil de CADA persona (no fijos)
  var cal = pfCalcularCalorias();
  var p = pfGetPerfil();
  if (!cal || !p) return { cal: 1800, pro: 90, car: 180, fat: 60 };
  var pro = Math.round(p.peso * 1.6);
  var fat = Math.round((cal.objetivo * 0.30) / 9);
  var car = Math.round((cal.objetivo - pro*4 - fat*9) / 4);
  return { cal: cal.objetivo, pro: pro, car: Math.max(car,0), fat: fat };
}

var pfEditorAbierto = false;
function pfMostrarEditor() { pfEditorAbierto = !pfEditorAbierto; sfRenderTab(); }
function pfRenderEditor(esOnboarding) {
  var p = pfGetPerfil() || { peso:'', altura:'', edad:'', actividad:'sedentaria', deficit:300 };
  var html = '<div class="df-card" style="border:1.5px solid var(--mo)">';
  html += '<h3>⚙️ ' + (esOnboarding ? 'Configura tu perfil para empezar' : 'Mi perfil') + '</h3>';
  if (esOnboarding) html += '<div style="font-size:11.5px;color:var(--su);margin-bottom:.7rem">Con estos datos calculamos tus calorías y metas personalizadas — solo tú las ves.</div>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.6rem">';
  html += '<div><label style="font-size:10px;color:var(--su)">Peso (kg)</label><input type="number" id="pf-peso" value="' + p.peso + '" style="width:100%;padding:7px 9px;border:1.5px solid var(--lv);border-radius:7px;font-size:13px"></div>';
  html += '<div><label style="font-size:10px;color:var(--su)">Altura (cm)</label><input type="number" id="pf-altura" value="' + p.altura + '" style="width:100%;padding:7px 9px;border:1.5px solid var(--lv);border-radius:7px;font-size:13px"></div>';
  html += '<div><label style="font-size:10px;color:var(--su)">Edad</label><input type="number" id="pf-edad" value="' + p.edad + '" style="width:100%;padding:7px 9px;border:1.5px solid var(--lv);border-radius:7px;font-size:13px"></div>';
  html += '<div><label style="font-size:10px;color:var(--su)">Déficit (kcal)</label><input type="number" id="pf-deficit" value="' + (p.deficit||0) + '" style="width:100%;padding:7px 9px;border:1.5px solid var(--lv);border-radius:7px;font-size:13px"></div>';
  html += '</div>';
  html += '<label style="font-size:10px;color:var(--su)">Nivel de actividad diaria (sin contar entrenamiento)</label>';
  html += '<select id="pf-actividad" style="width:100%;padding:8px 10px;border:1.5px solid var(--lv);border-radius:9px;font-size:13px;margin-bottom:.6rem">';
  [['sedentaria','Sedentaria — trabajo de escritorio'],['ligera','Ligera — camino algo'],['moderada','Moderada — bastante movimiento']].forEach(function(o){
    html += '<option value="' + o[0] + '"' + (p.actividad===o[0]?' selected':'') + '>' + o[1] + '</option>';
  });
  html += '</select>';
  html += '<div style="font-size:10px;color:#bbb;margin-bottom:.6rem">Nota: si tienes un objetivo de bajar de peso, un déficit de 250-350 kcal es un rango sostenible y saludable. Si no buscas bajar de peso, deja el déficit en 0.</div>';
  html += '<button class="btn bp" style="margin:0" onclick="pfGuardarEditor()">Guardar perfil</button>';
  html += '</div>';
  return html;
}
function pfGuardarEditor() {
  var peso = parseFloat(document.getElementById('pf-peso').value);
  var altura = parseFloat(document.getElementById('pf-altura').value);
  var edad = parseInt(document.getElementById('pf-edad').value);
  if (!peso || !altura || !edad) { alert('Completa peso, altura y edad para calcular tus metas.'); return; }
  var perfil = {
    peso: peso, altura: altura, edad: edad,
    deficit: parseInt(document.getElementById('pf-deficit').value) || 0,
    actividad: document.getElementById('pf-actividad').value
  };
  pfSavePerfil(perfil);
  pfEditorAbierto = false;
  dfToast('Perfil guardado ✓');
  sfRenderTab();
}

var SF = { fecha: new Date().toISOString().split('T')[0], tabActiva: 'nutricion', fotoComidaTemp: null, editandoComida: null };

function sfActualizarFecha() {
  var d = new Date(SF.fecha + 'T00:00:00');
  var dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  var meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var isHoy = SF.fecha === new Date().toISOString().split('T')[0];
  var bar = document.getElementById('sf-datebar');
  if (!bar) return;

function sfRenderTab() {

function dfCargarFotoComida(event) {
  var file = event.target.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas'), maxW = 500, scale = Math.min(1, maxW/img.width);
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      SF.fotoComidaTemp = canvas.toDataURL('image/jpeg',0.7);
      sfRenderTab();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function dfQuitarFotoComida() { SF.fotoComidaTemp = null; sfRenderTab(); }

async function dfLlamarIANutricion(descripcion, tiempo, fotoBase64) {
  var promptTexto = 'Eres nutricionista experta calculando macronutrientes con precisión para una app de seguimiento.\n\n' +
    (fotoBase64 ? 'Analiza la foto del plato adjunta. ' + (descripcion ? 'Descripción del usuario: "' + descripcion + '". ' : '') : 'Comida: "' + descripcion + '"\n') +
    'Tipo: ' + tiempo + '\n\n' +
    'Si tienes TODA la información necesaria, responde SOLO con este JSON sin markdown:\n' +
    '{"tipo":"macros","kcal":número,"pro":número,"car":número,"fat":número,"nota":"observación breve máximo 6 palabras en español"}\n\n' +
    'Si falta un dato IMPORTANTE, responde SOLO con:\n' +
    '{"tipo":"pregunta","pregunta":"tu pregunta breve, máximo 15 palabras"}\n\n' +
    'Prioriza calcular directamente con porciones estándar razonables. Solo pregunta si es realmente ambiguo.\n\n' +
    'IMPORTANTE: kcal, pro, car y fat deben ser siempre números ENTEROS, sin decimales.';
  var content;
  if (fotoBase64) {
    var mediaType = fotoBase64.substring(5, fotoBase64.indexOf(';'));
    var base64Data = fotoBase64.split(',')[1];
    content = [{ type:'image', source:{ type:'base64', media_type:mediaType, data:base64Data } }, { type:'text', text:promptTexto }];
  } else { content = promptTexto; }
  var res = await fetch(WORKER_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ model:'claude-haiku-4-5-20251001', max_tokens:300, messages:[{role:'user',content:content}] }) });
  var d = await res.json();
  var txt = d.content && d.content[0] ? d.content[0].text.trim() : '{}';
  txt = txt.replace(/```json|```/g,'').trim();
  var resultado = JSON.parse(txt);
  if (resultado.tipo === 'macros') {
    resultado.kcal = Math.round(resultado.kcal||0); resultado.pro = Math.round(resultado.pro||0);
    resultado.car = Math.round(resultado.car||0); resultado.fat = Math.round(resultado.fat||0);
  }
  return resultado;
}

async function dfAgregarComida() {
  var input = document.getElementById('df-comida-input');
  var tiempoEl = document.getElementById('df-tiempo');
  var desc = input ? input.value.trim() : '';
  var foto = SF.fotoComidaTemp;
  if (!desc && !foto) { input && input.focus(); return; }
  var tiempo = tiempoEl ? tiempoEl.value : 'Comida';
  var data = dfGetData();
  if (!data.comidas) data.comidas = [];
  var meal = { id: Date.now(), tiempo: tiempo, desc: desc || '(analizado por foto)', foto: foto||null, kcal:0,pro:0,car:0,fat:0, nota:'', loading:true };
  data.comidas.push(meal);
  dfSaveData({ comidas: data.comidas });
  if (input) input.value = ''; SF.fotoComidaTemp = null;
  sfRenderTab();
  try {
    var resultado = await dfLlamarIANutricion(desc, tiempo, foto);
    var freshData = dfGetData();
    var idx = freshData.comidas.findIndex(function(m){return m.id===meal.id;});
    if (idx < 0) return;
    if (resultado.tipo === 'pregunta') { freshData.comidas[idx].loading=false; freshData.comidas[idx].pendiente=true; freshData.comidas[idx].pregunta=resultado.pregunta; }
    else { freshData.comidas[idx] = Object.assign({}, freshData.comidas[idx], { kcal:resultado.kcal,pro:resultado.pro,car:resultado.car,fat:resultado.fat,nota:resultado.nota, loading:false, pendiente:false }); }
    dfSaveData({ comidas: freshData.comidas });
  } catch(e) {
    var freshData = dfGetData();
    var idx = freshData.comidas ? freshData.comidas.findIndex(function(m){return m.id===meal.id;}) : -1;
    if (idx>=0) { freshData.comidas[idx].loading=false; freshData.comidas[idx].nota='Error al calcular'; dfSaveData({comidas:freshData.comidas}); }
  }
  sfRenderTab();
}

async function dfResponderPregunta(mealId) {
  var input = document.getElementById('df-respuesta-'+mealId);
  var respuesta = input ? input.value.trim() : '';
  if (!respuesta) { input && input.focus(); return; }
  var data = dfGetData();
  var idx = data.comidas.findIndex(function(m){return m.id===mealId;});
  if (idx < 0) return;
  var descCompleta = data.comidas[idx].desc + ' (' + data.comidas[idx].pregunta + ' → ' + respuesta + ')';
  data.comidas[idx].desc = descCompleta; data.comidas[idx].pendiente=false; data.comidas[idx].loading=true;
  dfSaveData({ comidas: data.comidas }); sfRenderTab();
  try {
    var resultado = await dfLlamarIANutricion(descCompleta, data.comidas[idx].tiempo, data.comidas[idx].foto);
    var freshData = dfGetData();
    var idx2 = freshData.comidas.findIndex(function(m){return m.id===mealId;});

    h += '<div style="flex:1"><div class="pg-hist-fecha">'+fechaLbl+'</div>';
    if (r.peso) h += '<div class="pg-hist-peso">'+r.peso+' kg</div>';
    var medStr = Object.keys(r.medidas||{}).map(function(k){ var m=PG_MEDIDAS.find(function(x){return x.id===k;}); return (m?m.label:k)+': '+r.medidas[k]+'cm'; }).join(' · ');
    if (medStr) h += '<div class="pg-hist-medidas">'+medStr+'</div>';
    h += '</div><button class="pg-hist-del" onclick="pgEliminarRegistro('+r.id+')">✕</button></div>';
  });
  return h;
}
function pgEliminarRegistro(id) {
  if (!confirm('¿Eliminar este registro?')) return;
  pgSaveAll(pgGetAll().filter(function(r){return r.id!==id;}));
  pgRenderTab();
}
function pgRenderComparar() {
  var all = pgGetAll().slice().sort(function(a,b){return a.fecha.localeCompare(b.fecha);});
  if (all.length<2) return '<div style="text-align:center;padding:2rem 1rem;color:#bbb;font-size:13px">Necesitas al menos 2 registros para comparar.<br>Llevas '+all.length+' registro'+(all.length===1?'':'s')+'.</div>';
  var meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var fmtFecha = function(f){ var d=new Date(f+'T00:00:00'); return d.getDate()+' '+meses[d.getMonth()]+' '+d.getFullYear(); };
  if (PG.compA===null) PG.compA = all[0].fecha;
  if (PG.compB===null) PG.compB = all[all.length-1].fecha;
  var h = '<div class="df-card"><h3>🔍 Elige dos momentos</h3>';
  h += '<div style="font-size:11px;color:var(--su);margin-bottom:8px">Antes</div><select class="pg-select" id="pg-comp-a" onchange="pgActualizarComparacion()">';
  all.forEach(function(r){ h += '<option value="'+r.fecha+'"'+(r.fecha===PG.compA?' selected':'')+'>'+fmtFecha(r.fecha)+(r.peso?' — '+r.peso+'kg':'')+'</option>'; });
  h += '</select><div style="font-size:11px;color:var(--su);margin:8px 0">Ahora</div><select class="pg-select" id="pg-comp-b" onchange="pgActualizarComparacion()">';
  all.forEach(function(r){ h += '<option value="'+r.fecha+'"'+(r.fecha===PG.compB?' selected':'')+'>'+fmtFecha(r.fecha)+(r.peso?' — '+r.peso+'kg':'')+'</option>'; });
  h += '</select></div>';
  var regA = all.find(function(r){return r.fecha===PG.compA;}), regB = all.find(function(r){return r.fecha===PG.compB;});
  if (regA && regB) {
    h += '<div class="df-card"><div class="pg-compare-grid"><div class="pg-compare-col">';
    h += regA.foto ? ('<img src="'+regA.foto+'">') : '<div style="aspect-ratio:3/4;background:var(--ll);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2rem">📷</div>';
    h += '<div class="pg-compare-label">'+fmtFecha(regA.fecha)+'</div>';
    if (regA.peso) h += '<div style="font-size:1.2rem;font-weight:700;color:var(--mo);margin-top:2px">'+regA.peso+' kg</div>';
    h += '</div><div class="pg-compare-col">';
    h += regB.foto ? ('<img src="'+regB.foto+'">') : '<div style="aspect-ratio:3/4;background:var(--ll);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2rem">📷</div>';
    h += '<div class="pg-compare-label">'+fmtFecha(regB.fecha)+'</div>';
    if (regB.peso) h += '<div style="font-size:1.2rem;font-weight:700;color:var(--mo);margin-top:2px">'+regB.peso+' kg</div>';
    h += '</div></div>';
    if (regA.peso && regB.peso) {
      var difPeso = (regB.peso-regA.peso).toFixed(1);
      var color = difPeso<0?'#2E7D5B':(difPeso>0?'#C0392B':'#999');
      h += '<div style="text-align:center;padding:8px;background:var(--fo);border-radius:9px;margin-top:.7rem"><span style="font-size:11px;color:var(--su)">Diferencia de peso: </span><span style="font-weight:700;color:'+color+'">'+(difPeso>0?'+':'')+difPeso+' kg</span></div>';
    }
    var medidasComunes = PG_MEDIDAS.filter(function(m){return regA.medidas[m.id]!==undefined && regB.medidas[m.id]!==undefined;});
    if (medidasComunes.length>0) {
      h += '<div style="margin-top:.7rem">';
      medidasComunes.forEach(function(m){
        var difM = (regB.medidas[m.id]-regA.medidas[m.id]).toFixed(1);
        var colorM = difM<0?'#2E7D5B':(difM>0?'#C0392B':'#999');
        h += '<div class="pg-medida-row"><div class="pg-medida-label">'+m.icono+' '+m.label+'</div><div style="font-size:12px"><span style="color:#bbb">'+regA.medidas[m.id]+'→'+regB.medidas[m.id]+'cm</span> <span style="font-weight:700;color:'+colorM+'">('+(difM>0?'+':'')+difM+')</span></div></div>';
      });
      h += '</div>';
    }
    h += '</div>';
  }
  return h;
}
function pgActualizarComparacion() {
  PG.compA = document.getElementById('pg-comp-a')?.value || PG.compA;
  PG.compB = document.getElementById('pg-comp-b')?.value || PG.compB;
  pgRenderTab();
}

window.addEventListener('load', async function() {
  var logueado = await verificarSesion();
  if (!logueado) show('s-auth');
});
</script>
